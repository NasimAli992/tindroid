// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'

        // For FCM push notifications
        classpath 'com.google.gms:google-services:4.4.4'

        // Crashlytics
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'

        // Legal compliance: plugin to collect and display OSS licenses.
        classpath 'com.google.android.gms:oss-licenses-plugin:0.10.10'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// This block encapsulates custom properties and makes them available to all
// modules in the project.
ext {
    version_code = gitVersionCode()
    version_name = gitVersionName()
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.google.com/' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

// Use git revision counter as a version code.
static def gitVersionCode() {
    try {
        def process = "git rev-list --count HEAD".execute()
        process.waitFor()
        def count = process.text.trim()
        return count.isEmpty() ? 1 : count.toInteger()
    } catch (Exception e) {
        return 1
    }
}

// Use current git tag as a version name.
// For example, if the git tag is 'v0.20.0-rc1' then the version name will be '0.20.0-rc1'.
static def gitVersionName() {
    try {
        def process = "git describe --tags".execute()
        process.waitFor()
        def tag = process.text.trim()
        
        // If no tags found or error occurred, use a default version
        if (tag.isEmpty() || tag.contains("fatal")) {
            return "1.0.0"
        }
        
        // Remove leading 'v' as in 'v1.2.3'
        if (tag.startsWith('v') && tag.length() > 1) {
            return tag.substring(1)
        }
        return tag
    } catch (Exception e) {
        return "1.0.0"
    }
}
